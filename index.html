<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#120630" />
  <title>Cuenta regresiva Día del Hombre</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Bowlby+One&display=swap" rel="stylesheet">
  <style>
    /* =====================================================
       DISEÑO "VICE KEY ART" (inspirado en GTA VI)
       Tipografías: Bowlby One (palabras y números) + Abril Fatface (XIX)
       ===================================================== */
    :root {
      --bg: #120630;
      --text: #fff6f2;
      --muted: rgba(255,240,245,0.82);
      --soft: rgba(255,240,245,0.62);
      --ink: #0b0418;
      --pink: #ff3d9a;
      --orange: #ff8a3d;
      --sun: #ffd166;
      --purple: #8a3ffc;
      --cyan: #2de2e6;
      --neon: linear-gradient(120deg, var(--cyan), var(--purple), var(--pink), var(--orange), var(--cyan));
      --sunset: linear-gradient(100deg, var(--sun), var(--orange) 35%, var(--pink) 70%, var(--purple));
      --display: 'Bowlby One', 'Arial Black', Impact, sans-serif;
      --ui: 'Segoe UI', Inter, Arial, Helvetica, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { background: var(--bg); }

    body {
      min-height: 100vh;
      overflow-x: hidden;
      color: var(--text);
      font-family: var(--ui);
    }

    button, video { font: inherit; }

    /* ---------- Pantallas ---------- */
    .screen {
      position: relative;
      min-height: 100vh;
      min-height: 100dvh;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 22px clamp(14px, 3vw, 40px);
      overflow: hidden;
      text-align: center;
      --px: 0;
      --py: 0;
    }

    #finalScreen { display: none; }

    /* ---------- Escena de fondo ---------- */
    .scene, .scene > * {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .scene { z-index: 0; }

    .bg-wrap {
      inset: -3%;
      transform: translate(calc(var(--px) * -14px), calc(var(--py) * -10px));
      transition: transform 0.6s ease-out;
    }

    .bg {
      position: absolute;
      inset: 0;
      background: #120630 url('fondo_vice.svg') center 62% / cover no-repeat;
      transform-origin: 50% 60%;
      animation: kenBurns 30s ease-in-out infinite alternate;
    }

    .sun-pulse {
      background: radial-gradient(circle at 50% 58%, rgba(255,210,122,0.35), transparent 32%);
      mix-blend-mode: screen;
      animation: breathe 6s ease-in-out infinite;
    }

    .palms {
      inset: auto 0 0 0;
      height: 100%;
      transform: translate(calc(var(--px) * 22px), calc(var(--py) * 8px));
      transition: transform 0.6s ease-out;
    }

    .palm {
      position: absolute;
      bottom: -5%;
      width: clamp(180px, 25vw, 420px);
      height: auto;
      fill: #0d0318;
      transform-origin: 50% 100%;
      filter: drop-shadow(0 0 22px rgba(255,61,154,0.3));
    }

    .palm.left { left: -4%; animation: sway 6.5s ease-in-out infinite; }
    .palm.left.back { left: 10%; bottom: -12%; width: clamp(120px, 15vw, 250px); opacity: 0.75; animation-duration: 8s; animation-delay: -2s; }
    .palm.right { right: -4%; animation: swayFlip 7.2s ease-in-out infinite; }

    .flare {
      background: linear-gradient(105deg, transparent 40%, rgba(255,209,102,0.12) 47%, rgba(255,255,255,0.18) 50%, rgba(255,61,154,0.12) 53%, transparent 60%);
      background-size: 250% 100%;
      mix-blend-mode: screen;
      animation: flareSweep 10s ease-in-out infinite;
    }

    .scan {
      background: repeating-linear-gradient(180deg, rgba(255,255,255,0.035) 0 1px, transparent 1px 3px);
      mix-blend-mode: overlay;
      opacity: 0.55;
    }

    .grain {
      opacity: 0.05;
      background-image: radial-gradient(rgba(255,255,255,0.9) 0.5px, transparent 0.5px);
      background-size: 4px 4px;
      animation: grainShift 0.8s steps(3) infinite;
    }

    .shade {
      background:
        linear-gradient(180deg, rgba(11,4,24,0.55) 0%, transparent 20%, transparent 50%, rgba(11,4,24,0.72) 100%),
        radial-gradient(ellipse 120% 90% at 50% 45%, transparent 55%, rgba(11,4,24,0.6) 100%);
    }

    /* ---------- HUD superior ---------- */
    .hud-top {
      position: relative;
      z-index: 2;
      width: min(1180px, 100%);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      animation: dropIn 0.8s cubic-bezier(.2,.8,.2,1) 0.1s both;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      max-width: 100%;
      padding: 9px 16px;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 999px;
      background: rgba(14,6,30,0.55);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      font-size: 0.74rem;
      font-weight: 800;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      line-height: 1.3;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }

    .chip.live { color: var(--cyan); }

    .chip.date {
      color: var(--sun);
      letter-spacing: 0.08em;
      text-align: left;
    }

    .dot {
      flex: 0 0 auto;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--pink);
      box-shadow: 0 0 0 0 rgba(255,61,154,0.7);
      animation: livePulse 1.6s ease-out infinite;
    }

    /* ---------- Centro ---------- */
    .stage {
      position: relative;
      z-index: 2;
      flex: 1;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(14px, 2.6vh, 28px);
    }

    /* Logo: "día del hombre" sobre XIX */
    h1.logo {
      width: min(720px, 92vw, 66vh);
      transform: translate(calc(var(--px) * 8px), calc(var(--py) * 6px));
      transition: transform 0.6s ease-out;
    }

    .logo svg {
      display: block;
      width: 100%;
      height: auto;
      overflow: visible;
      filter: drop-shadow(0 22px 40px rgba(0,0,0,0.55)) drop-shadow(0 0 46px rgba(255,61,154,0.35));
    }

    .num {
      font-family: 'Abril Fatface', 'Bodoni MT Black', Georgia, serif;
      font-size: 360px;
      letter-spacing: -6px;
    }

    .num-extrude { fill: var(--ink); stroke: var(--ink); stroke-width: 30; stroke-linejoin: round; }
    .num-back { fill: var(--ink); stroke: var(--ink); stroke-width: 30; stroke-linejoin: round; }
    .num-white { fill: none; stroke: #fff6f2; stroke-width: 12; stroke-linejoin: round; }
    .num-front { fill: url(#numFill); }

    .num-group {
      transform-box: fill-box;
      transform-origin: center;
      animation: numIn 1.2s cubic-bezier(.16,.9,.24,1) 0.3s both;
    }

    .num-gloss { animation: glossMove 5s ease-in-out infinite; }

    .words text {
      font-family: var(--display);
      font-size: 92px;
      letter-spacing: -1px;
    }

    .w-shadow { fill: var(--ink); stroke: var(--ink); stroke-width: 20; stroke-linejoin: round; }
    .w-main { fill: #ffffff; stroke: var(--ink); stroke-width: 18; stroke-linejoin: round; paint-order: stroke fill; }

    .word {
      transform-box: fill-box;
      transform-origin: center;
      animation: wordIn 0.7s cubic-bezier(.2,.9,.3,1.35) both;
    }

    .word:nth-child(1) { animation-delay: 0.95s; }
    .word:nth-child(2) { animation-delay: 1.1s; }
    .word:nth-child(3) { animation-delay: 1.25s; }

    /* Contador tipo HUD */
    .hud {
      position: relative;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      width: min(860px, 100%);
      padding: 16px 8px 14px;
      border-radius: 18px;
      background: linear-gradient(180deg, rgba(255,255,255,0.09), rgba(255,255,255,0.02)), rgba(14,6,30,0.62);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.1), 0 18px 50px rgba(0,0,0,0.45), 0 0 40px rgba(138,63,252,0.28);
      overflow: hidden;
      animation: riseIn 0.9s cubic-bezier(.2,.9,.25,1.1) 1.35s both;
    }

    .hud::after {
      content: "";
      position: absolute;
      inset: 0;
      padding: 2px;
      border-radius: inherit;
      background: var(--neon);
      background-size: 300% 300%;
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
      animation: gradientFlow 5s linear infinite alternate;
      pointer-events: none;
    }

    .hud::before {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: -40%;
      width: 30%;
      background: linear-gradient(100deg, transparent, rgba(255,255,255,0.12), transparent);
      transform: skewX(-18deg);
      animation: shine 7s ease-in-out infinite;
    }

    .cell {
      position: relative;
      min-width: 0;
      padding: 4px 6px;
    }

    .cell + .cell::before {
      content: "";
      position: absolute;
      left: 0;
      top: 14%;
      bottom: 14%;
      width: 2px;
      background: linear-gradient(180deg, transparent, var(--pink), var(--cyan), transparent);
      opacity: 0.8;
    }

    .value {
      display: block;
      font-family: var(--display);
      font-size: clamp(2.5rem, 6.4vw, 4.4rem);
      line-height: 1.05;
      color: #fff;
      -webkit-text-stroke: 0.1em var(--ink);
      paint-order: stroke fill;
      text-shadow: 0.04em 0.06em 0 var(--ink), 0 0 26px rgba(255,61,154,0.55);
    }

    .value.tick { animation: tick 0.45s cubic-bezier(.2,.9,.3,1.4); }

    .label {
      display: block;
      margin-top: 6px;
      color: var(--sun);
      font-size: 0.74rem;
      font-weight: 800;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      text-shadow: 0 0 10px rgba(255,138,61,0.5);
    }

    .subtitle {
      color: var(--muted);
      font-size: 1rem;
      font-weight: 600;
      text-shadow: 0 2px 10px rgba(0,0,0,0.7);
      animation: fadeUp 0.8s ease 1.7s both;
    }

    .footer-note {
      position: relative;
      z-index: 2;
      max-width: 760px;
      color: var(--soft);
      font-size: 0.82rem;
      line-height: 1.5;
      text-shadow: 0 2px 8px rgba(0,0,0,0.7);
      animation: fadeUp 0.8s ease 1.9s both;
    }

    /* ---------- Pantalla del video ---------- */
    .final-wrap {
      position: relative;
      z-index: 2;
      flex: 1;
      width: min(980px, 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }

    .final-kicker { color: var(--cyan); animation: dropIn 0.7s ease 0.1s both; }

    .video-message {
      max-width: 900px;
      font-family: var(--display);
      font-size: clamp(1.6rem, 4.4vw, 3rem);
      line-height: 1.02;
      color: #fff;
      -webkit-text-stroke: 0.12em var(--ink);
      paint-order: stroke fill;
      text-shadow: 0.05em 0.07em 0 var(--ink), 0 0 30px rgba(255,61,154,0.5);
      animation: wordIn 0.9s cubic-bezier(.2,.9,.3,1.3) 0.25s both;
    }

    .video-frame {
      width: 100%;
      padding: 3px;
      border-radius: 14px;
      background: var(--neon);
      background-size: 300% 300%;
      box-shadow: 0 0 34px rgba(255,61,154,0.45), 0 0 80px rgba(138,63,252,0.3), 0 24px 70px rgba(0,0,0,0.55);
      animation: gradientFlow 5s linear infinite alternate, riseIn 0.9s cubic-bezier(.2,.9,.25,1.1) 0.5s both;
    }

    video {
      display: block;
      width: 100%;
      max-height: 56vh;
      border-radius: 11px;
      background: #000;
    }

    .action-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      animation: fadeUp 0.8s ease 0.9s both;
    }

    .control-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 48px;
      padding: 0 20px;
      border: 2px solid var(--ink);
      border-radius: 999px;
      background: var(--sunset);
      background-size: 200% 100%;
      color: var(--ink);
      cursor: pointer;
      font-family: var(--display);
      font-size: 0.95rem;
      letter-spacing: 0.02em;
      box-shadow: 4px 5px 0 var(--ink), 0 0 22px rgba(255,61,154,0.35);
      transition: transform 160ms ease, box-shadow 160ms ease, background-position 400ms ease;
    }

    .control-button:hover,
    .control-button:focus-visible {
      background-position: 100% 0;
      transform: translate(-1px, -2px);
      box-shadow: 6px 7px 0 var(--ink), 0 0 30px rgba(255,138,61,0.6);
      outline: none;
    }

    .control-button.is-pulsing { animation: buttonPulse 1.1s ease-in-out infinite; }

    .button-icon { font-size: 1.1rem; line-height: 1; }

    .final-status {
      max-width: 780px;
      color: var(--soft);
      font-size: 0.86rem;
      line-height: 1.5;
      text-shadow: 0 2px 8px rgba(0,0,0,0.7);
    }

    /* ---------- Animaciones ---------- */
    @keyframes kenBurns { 0% { transform: scale(1.03); } 100% { transform: scale(1.14) translate(-1.5%, -1%); } }
    @keyframes breathe { 0%, 100% { opacity: 0.7; } 50% { opacity: 1; } }
    @keyframes sway { 0%, 100% { transform: rotate(-1.6deg); } 50% { transform: rotate(1.8deg); } }
    @keyframes swayFlip { 0%, 100% { transform: scaleX(-1) rotate(-1.4deg); } 50% { transform: scaleX(-1) rotate(1.9deg); } }
    @keyframes flareSweep { 0% { background-position: 120% 0; } 55%, 100% { background-position: -40% 0; } }
    @keyframes grainShift { 0% { transform: translate(0,0); } 33% { transform: translate(-1px,1px); } 66% { transform: translate(1px,-1px); } 100% { transform: translate(0,0); } }
    @keyframes livePulse { 0% { box-shadow: 0 0 0 0 rgba(255,61,154,0.7); } 100% { box-shadow: 0 0 0 10px rgba(255,61,154,0); } }
    @keyframes dropIn { from { opacity: 0; transform: translateY(-16px); } to { opacity: 1; transform: none; } }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @keyframes riseIn { from { opacity: 0; transform: translateY(30px) scale(0.95); } to { opacity: 1; transform: none; } }
    @keyframes numIn { 0% { opacity: 0; transform: scale(1.5) rotate(-6deg); filter: blur(14px); } 60% { opacity: 1; filter: blur(0); } 100% { opacity: 1; transform: none; } }
    @keyframes wordIn { from { opacity: 0; transform: translateY(-50px) scale(1.4); } to { opacity: 1; transform: none; } }
    @keyframes glossMove { 0%, 100% { transform: translateX(-120px); opacity: 0.5; } 50% { transform: translateX(120px); opacity: 0.85; } }
    @keyframes gradientFlow { 0% { background-position: 0% 50%; } 100% { background-position: 100% 50%; } }
    @keyframes shine { 0%, 70% { left: -40%; } 100% { left: 120%; } }
    @keyframes tick { 0% { transform: translateY(-10px) scale(1.15); color: var(--sun); } 100% { transform: none; color: #fff; } }
    @keyframes buttonPulse { 0%, 100% { box-shadow: 4px 5px 0 var(--ink), 0 0 18px rgba(255,61,154,0.35); } 50% { box-shadow: 4px 5px 0 var(--ink), 0 0 38px rgba(255,138,61,0.8); } }

    /* ---------- Responsive ---------- */
    @media (max-width: 720px) {
      .screen { padding: 16px 14px 18px; gap: 12px; }

      .hud-top { flex-direction: column; gap: 8px; }

      .chip { font-size: 0.68rem; letter-spacing: 0.14em; padding: 8px 12px; }
      .chip.date { text-align: center; letter-spacing: 0.06em; }

      .hud {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        row-gap: 10px;
        padding: 12px 6px;
      }

      .cell:nth-child(3)::before { display: none; }

      .value { font-size: clamp(2.4rem, 13vw, 3.4rem); }

      .palm { opacity: 0.7; }
      .palm.left.back { display: none; }

      .subtitle { font-size: 0.92rem; }

      video { max-height: 52vh; }
    }

    @media (max-width: 420px) {
      .control-button { width: 100%; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="palmShape" viewBox="0 0 220 420">
        <path d="M104 420 C100 340 96 260 108 168 L116 168 C108 262 114 340 122 420 Z"/>
        <path d="M112 168 C84 132 46 126 6 150 C44 138 78 146 110 176 Z"/>
        <path d="M112 166 C92 120 58 96 18 98 C58 108 88 134 108 174 Z"/>
        <path d="M112 164 C112 118 96 78 64 52 C92 86 104 124 106 168 Z"/>
        <path d="M112 164 C130 118 160 92 204 92 C164 106 136 132 116 172 Z"/>
        <path d="M114 168 C146 134 184 130 216 152 C180 144 148 152 118 178 Z"/>
        <path d="M112 166 C124 122 150 86 186 60 C156 96 130 130 116 170 Z"/>
        <path d="M110 170 C86 176 60 196 46 232 C66 204 90 188 114 178 Z"/>
        <path d="M114 170 C140 178 162 200 172 236 C154 206 132 190 110 180 Z"/>
      </symbol>
    </defs>
  </svg>

  <!-- ===================== CONTADOR ===================== -->
  <section id="countdownScreen" class="screen" aria-live="polite">
    <div class="scene" aria-hidden="true">
      <div class="bg-wrap"><div class="bg"></div></div>
      <div class="sun-pulse"></div>
      <div class="palms">
        <svg class="palm left back" viewBox="0 0 220 420"><use href="#palmShape"/></svg>
        <svg class="palm left" viewBox="0 0 220 420"><use href="#palmShape"/></svg>
        <svg class="palm right" viewBox="0 0 220 420"><use href="#palmShape"/></svg>
      </div>
      <div class="flare"></div>
      <div class="scan"></div>
      <div class="grain"></div>
      <div class="shade"></div>
    </div>

    <header class="hud-top">
      <div class="chip live"><span class="dot" aria-hidden="true"></span><span id="eyebrowText">Cuenta regresiva especial</span></div>
      <div class="chip date" id="eventDateText">19 de noviembre, 09:00</div>
    </header>

    <div class="stage">
      <h1 id="mainTitle" class="logo" aria-label="Día del Hombre">
        <svg viewBox="0 0 800 470" aria-hidden="true">
          <defs>
            <linearGradient id="numFill" x1="0" y1="0" x2="0.35" y2="1">
              <stop offset="0" stop-color="#ffe17a"/>
              <stop offset="0.22" stop-color="#ffb347"/>
              <stop offset="0.45" stop-color="#ff6a3d"/>
              <stop offset="0.7" stop-color="#ff3d9a"/>
              <stop offset="1" stop-color="#a13cff"/>
            </linearGradient>
            <linearGradient id="numGloss" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#fff" stop-opacity="0.7"/>
              <stop offset="1" stop-color="#fff" stop-opacity="0"/>
            </linearGradient>
            <clipPath id="numClip">
              <text class="num" x="400" y="325" text-anchor="middle">XIX</text>
            </clipPath>
          </defs>

          <g class="num-group">
            <text class="num num-extrude" x="412" y="338" text-anchor="middle">XIX</text>
            <text class="num num-back" x="400" y="325" text-anchor="middle">XIX</text>
            <text class="num num-white" x="400" y="325" text-anchor="middle">XIX</text>
            <text class="num num-front" x="400" y="325" text-anchor="middle">XIX</text>
            <g clip-path="url(#numClip)">
              <rect class="num-gloss" x="40" y="60" width="720" height="110" fill="url(#numGloss)" transform="skewY(-8)"/>
            </g>
          </g>

          <g class="words" id="logoWords">
            <g class="word"><text class="w-shadow" x="226" y="290" data-line="0">día</text><text class="w-main" x="220" y="283" data-line="0">día</text></g>
            <g class="word"><text class="w-shadow" x="226" y="368" data-line="1">del</text><text class="w-main" x="220" y="361" data-line="1">del</text></g>
            <g class="word"><text class="w-shadow" x="226" y="446" data-line="2">hombre</text><text class="w-main" x="220" y="439" data-line="2">hombre</text></g>
          </g>
        </svg>
      </h1>

      <div class="hud" role="timer" aria-label="Cuenta regresiva">
        <div class="cell"><span class="value" id="days">00</span><span class="label">Días</span></div>
        <div class="cell"><span class="value" id="hours">00</span><span class="label">Horas</span></div>
        <div class="cell"><span class="value" id="minutes">00</span><span class="label">Minutos</span></div>
        <div class="cell"><span class="value" id="seconds">00</span><span class="label">Segundos</span></div>
      </div>

      <p class="subtitle" id="subtitleText">Esperando el 19 de noviembre a las 09:00.</p>
    </div>

    <footer class="footer-note" id="footerNote">Hora de Chile.</footer>
  </section>

  <!-- ===================== VIDEO ===================== -->
  <section id="finalScreen" class="screen">
    <div class="scene" aria-hidden="true">
      <div class="bg-wrap"><div class="bg"></div></div>
      <div class="sun-pulse"></div>
      <div class="flare"></div>
      <div class="grain"></div>
      <div class="shade"></div>
    </div>

    <div class="final-wrap">
      <div class="chip live final-kicker"><span class="dot" aria-hidden="true"></span><span id="finalKicker">Día del Hombre activo</span></div>
      <div class="video-message" id="finalMessage">Feliz Día del Hombre</div>

      <div class="video-frame">
        <video id="finalVideo" controls playsinline preload="metadata" muted>
          <source src="video.mp4" type="video/mp4">
          Tu navegador no soporta video HTML5.
        </video>
      </div>

      <div class="action-row">
        <button class="control-button" id="soundButton" type="button">
          <span class="button-icon" aria-hidden="true">♪</span>
          <span class="button-text">Activar sonido</span>
        </button>
        <button class="control-button" id="replayButton" type="button">
          <span class="button-icon" aria-hidden="true">↺</span>
          <span>Reproducir de nuevo</span>
        </button>
      </div>

      <div class="final-status" id="finalStatus">Activo hasta el final del día.</div>
    </div>
  </section>

  <script>
    // =====================================================
    // CONFIGURACIÓN
    // =====================================================
    const EVENT_CONFIG = {
      month: 11,
      day: 19,
      hour: 9,
      minute: 0,
      timeZone: 'America/Santiago',
      eyebrowText: 'Cuenta regresiva especial',
      titleWords: ['día', 'del', 'hombre'], // palabras del logo (una por línea)
      subtitleText: 'Esperando el 19 de noviembre a las 09:00.',
      footerText: 'Hora de Chile. Al terminar el día, el contador vuelve automáticamente al próximo 19 de noviembre.',
      endMessage: 'Por si no te saludaron: feliz Día del Hombre',
      videoPath: 'video.mp4',
      autoplayWhenActive: true,
      autoplayMuted: true
    };

    const demoMode = new URLSearchParams(window.location.search).get('demo') === 'dia';
    const daysEl = document.getElementById('days');
    const hoursEl = document.getElementById('hours');
    const minutesEl = document.getElementById('minutes');
    const secondsEl = document.getElementById('seconds');
    const countdownScreen = document.getElementById('countdownScreen');
    const finalScreen = document.getElementById('finalScreen');
    const finalVideo = document.getElementById('finalVideo');
    const finalKickerEl = document.getElementById('finalKicker');
    const finalStatusEl = document.getElementById('finalStatus');
    const eventDateTextEl = document.getElementById('eventDateText');
    const replayButton = document.getElementById('replayButton');
    const soundButton = document.getElementById('soundButton');
    const soundButtonText = soundButton.querySelector('.button-text');

    document.getElementById('eyebrowText').textContent = EVENT_CONFIG.eyebrowText;
    document.querySelectorAll('#mainTitle [data-line]').forEach((el) => {
      el.textContent = EVENT_CONFIG.titleWords[Number(el.dataset.line)] || '';
    });
    document.getElementById('subtitleText').textContent = EVENT_CONFIG.subtitleText;
    document.getElementById('footerNote').textContent = EVENT_CONFIG.footerText;
    document.getElementById('finalMessage').textContent = EVENT_CONFIG.endMessage;
    finalVideo.querySelector('source').src = EVENT_CONFIG.videoPath;
    finalVideo.load();

    // Centra el bloque de palabras sobre el XIX cuando la fuente ya cargó
    function centerLogoWords() {
      const words = document.getElementById('logoWords');
      words.removeAttribute('transform');
      const box = words.getBBox();
      if (!box.width) {
        return;
      }
      const dx = 400 - (box.x + box.width / 2);
      words.setAttribute('transform', `translate(${dx.toFixed(1)} 0)`);
    }

    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(centerLogoWords);
    } else {
      window.addEventListener('load', centerLogoWords);
    }

    // Leve movimiento del fondo y logo siguiendo el mouse (solo PC)
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (!reduceMotion && window.matchMedia('(pointer: fine)').matches) {
      window.addEventListener('pointermove', (event) => {
        const px = (event.clientX / window.innerWidth - 0.5) * 2;
        const py = (event.clientY / window.innerHeight - 0.5) * 2;
        document.querySelectorAll('.screen').forEach((screen) => {
          screen.style.setProperty('--px', px.toFixed(3));
          screen.style.setProperty('--py', py.toFixed(3));
        });
      });
    }

    const partsFormatter = new Intl.DateTimeFormat('en-US', {
      timeZone: EVENT_CONFIG.timeZone,
      calendar: 'gregory',
      numberingSystem: 'latn',
      year: 'numeric',
      month: '2-digit',
      day: '2-digit',
      hour: '2-digit',
      minute: '2-digit',
      second: '2-digit',
      hourCycle: 'h23'
    });

    function pad(n) {
      return String(n).padStart(2, '0');
    }

    function getZonedParts(date) {
      const parts = {};
      partsFormatter.formatToParts(date).forEach((part) => {
        if (part.type !== 'literal') {
          parts[part.type] = Number(part.value);
        }
      });

      if (parts.hour === 24) {
        parts.hour = 0;
      }

      return parts;
    }

    function getTimeZoneOffset(date) {
      const parts = getZonedParts(date);
      const asUTC = Date.UTC(parts.year, parts.month - 1, parts.day, parts.hour, parts.minute, parts.second);
      const dateWithoutMs = date.getTime() - (date.getTime() % 1000);
      return asUTC - dateWithoutMs;
    }

    function makeZonedDate(year, month, day, hour, minute, second = 0) {
      const utcGuess = Date.UTC(year, month - 1, day, hour, minute, second);
      const firstOffset = getTimeZoneOffset(new Date(utcGuess));
      let zonedDate = utcGuess - firstOffset;
      const secondOffset = getTimeZoneOffset(new Date(zonedDate));

      if (firstOffset !== secondOffset) {
        zonedDate = utcGuess - secondOffset;
      }

      return new Date(zonedDate);
    }

    function formatInEventZone(date, options) {
      return new Intl.DateTimeFormat('es-CL', {
        timeZone: EVENT_CONFIG.timeZone,
        ...options
      }).format(date);
    }

    function makeEventStart(year) {
      return makeZonedDate(year, EVENT_CONFIG.month, EVENT_CONFIG.day, EVENT_CONFIG.hour, EVENT_CONFIG.minute);
    }

    function makeEventEnd(year) {
      return makeZonedDate(year, EVENT_CONFIG.month, EVENT_CONFIG.day + 1, 0, 0);
    }

    function getEventWindow(now = new Date()) {
      const currentYear = getZonedParts(now).year;

      if (demoMode) {
        return {
          state: 'active',
          year: currentYear,
          start: new Date(now.getTime() - 60000),
          end: new Date(now.getTime() + 86400000),
          target: now,
          demo: true
        };
      }

      const startThisYear = makeEventStart(currentYear);
      const endThisYear = makeEventEnd(currentYear);

      if (now < startThisYear) {
        return {
          state: 'countdown',
          year: currentYear,
          start: startThisYear,
          end: endThisYear,
          target: startThisYear,
          demo: false
        };
      }

      if (now < endThisYear) {
        return {
          state: 'active',
          year: currentYear,
          start: startThisYear,
          end: endThisYear,
          target: startThisYear,
          demo: false
        };
      }

      const nextYear = currentYear + 1;

      return {
        state: 'countdown',
        year: nextYear,
        start: makeEventStart(nextYear),
        end: makeEventEnd(nextYear),
        target: makeEventStart(nextYear),
        demo: false
      };
    }

    function getTargetLabel(eventWindow) {
      const date = formatInEventZone(eventWindow.start, {
        weekday: 'long',
        day: 'numeric',
        month: 'long',
        year: 'numeric',
        hour: '2-digit',
        minute: '2-digit'
      });

      return `Próximo desbloqueo: ${date}`;
    }

    function getFinalStatus(eventWindow) {
      if (eventWindow.demo) {
        return 'Modo prueba activo. Quita ?demo=dia de la URL para volver al contador real.';
      }

      const endTime = formatInEventZone(eventWindow.end, {
        hour: '2-digit',
        minute: '2-digit'
      });

      return `Activo hasta las ${endTime}. Después vuelve el contador del próximo Día del Hombre.`;
    }

    // Cambia el número y dispara la animación de "golpe" solo si cambió
    function setValue(el, value) {
      if (el.textContent === value) {
        return;
      }

      el.textContent = value;
      el.classList.remove('tick');
      void el.offsetWidth;
      el.classList.add('tick');
    }

    function updateCountdownValues(target, now) {
      const diff = Math.max(0, target - now);
      const totalSeconds = Math.floor(diff / 1000);
      const days = Math.floor(totalSeconds / 86400);
      const hours = Math.floor((totalSeconds % 86400) / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;

      setValue(daysEl, pad(days));
      setValue(hoursEl, pad(hours));
      setValue(minutesEl, pad(minutes));
      setValue(secondsEl, pad(seconds));
    }

    let currentScreen = '';
    let autoplayEventId = '';

    function switchScreen(screen) {
      if (currentScreen === screen) {
        return;
      }

      currentScreen = screen;
      const showFinal = screen === 'final';
      countdownScreen.style.display = showFinal ? 'none' : 'flex';
      finalScreen.style.display = showFinal ? 'flex' : 'none';
      document.body.classList.toggle('is-final', showFinal);

      if (!showFinal) {
        finalVideo.pause();
        replayButton.classList.remove('is-pulsing');
      }
    }

    function updateSoundButton() {
      soundButtonText.textContent = finalVideo.muted ? 'Activar sonido' : 'Silenciar';
    }

    function playVideoFromStart() {
      finalVideo.currentTime = 0;
      replayButton.classList.remove('is-pulsing');
      finalVideo.play().catch(() => {});
    }

    function showFinalVideo(eventWindow) {
      switchScreen('final');
      finalKickerEl.textContent = eventWindow.demo ? 'Modo prueba activo' : 'Día del Hombre activo';
      finalStatusEl.textContent = getFinalStatus(eventWindow);

      const eventId = String(eventWindow.start.getTime());
      if (autoplayEventId === eventId) {
        return;
      }

      autoplayEventId = eventId;
      finalVideo.currentTime = 0;
      finalVideo.muted = EVENT_CONFIG.autoplayMuted;
      updateSoundButton();

      if (EVENT_CONFIG.autoplayWhenActive) {
        finalVideo.play().catch(() => {
          finalStatusEl.textContent = `${getFinalStatus(eventWindow)} Dale play cuando el navegador lo permita.`;
        });
      }
    }

    function render() {
      const now = new Date();
      const eventWindow = getEventWindow(now);

      if (eventWindow.state === 'active') {
        showFinalVideo(eventWindow);
        return;
      }

      switchScreen('countdown');
      updateCountdownValues(eventWindow.target, now);
      eventDateTextEl.textContent = getTargetLabel(eventWindow);
    }

    replayButton.addEventListener('click', playVideoFromStart);

    soundButton.addEventListener('click', () => {
      finalVideo.muted = !finalVideo.muted;
      updateSoundButton();

      if (!finalVideo.muted && finalVideo.paused) {
        finalVideo.play().catch(() => {});
      }
    });

    finalVideo.addEventListener('volumechange', updateSoundButton);
    finalVideo.addEventListener('ended', () => {
      replayButton.classList.add('is-pulsing');
    });

    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) {
        render();
      }
    });

    render();
    setInterval(render, 1000);
  </script>
</body>
</html>
